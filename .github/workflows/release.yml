name: Release Yoel

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by GoReleaser to read tags and git history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Delete failed release tag
    needs: [test, release]
    if: >-
      ${{
        always() &&
        startsWith(github.ref, 'refs/tags/v') &&
        (needs.test.result == 'failure' ||
         needs.release.result == 'failure')
      }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Delete failed release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh api \
            --method DELETE \
            "repos/$REPO/git/refs/tags/$TAG"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
