version: 2
project_name: "yoel"
before:
  hooks:
    - go mod tidy

builds:
  - id: yoel
    main: ./cmd/yoel
    binary: yoel
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version=v{{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github

release:
  # github:
  #   owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
  #   name: "{{ .ProjectName }}"
  draft: false
  prerelease: auto
  mode: replace
